version: "3"

services:
  nginx:
    image: nginx:stable-alpine3.24
    ports:
      - "3000:80"
    volumes:
      - ./src/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  node-app:
    build: .
    environment:
      - PORT=3000
    depends_on:
      - mongo
      - redis
  mongo:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: eyad
      MONGO_INITDB_ROOT_PASSWORD: eyad208
    volumes:
      - mongo-db:/data/db
  redis:
    image: redis

volumes:
  mongo-db:
