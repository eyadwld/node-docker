version: "3"
services:
  nginx:
    ports:
      - "3000:80"
  node-app:
    build:
      context: .
      args:
        - NODE_ENV=development
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - MONGO_NAME=eyad
      - MONGO_PASSWORD=eyad
      - SESSION_SECRET=secret
      - REDIS_URL=redis://redis:6379
    command: npm run dev
  mongo:
    environment:
      MONGO_INITDB_ROOT_USERNAME: eyad
      MONGO_INITDB_ROOT_PASSWORD: eyad208
